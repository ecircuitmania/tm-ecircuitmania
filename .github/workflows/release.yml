name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract version from info.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' info.toml | sed 's/version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: Check if tag exists
        id: check_tag
        # Ask the remote: the checkout fetches no tags, so a local lookup never finds one.
        # ls-remote exits 2 when the tag doesn't exist; any other failure stops the release.
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.get_version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          elif [ $? -eq 2 ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            exit 1
          fi
      
      - name: Create plugin package
        if: steps.check_tag.outputs.exists == 'false'
        # DevTrace.as is dev-only: every call into it is inside #if DEV.
        run: |
          mkdir -p build
          zip -r build/ecircuitmaniadata.zip src/ vendor/ info.toml -x src/DevTrace.as
          mv build/ecircuitmaniadata.zip build/ecircuitmaniadata.op
      
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: eCircuitMania Match Data ${{ steps.get_version.outputs.version }}
          files: build/ecircuitmaniadata.op
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
